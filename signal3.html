<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Board Pro</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
  body { background:#0d1117; color:#fff; padding:15px; text-align:center; }
  
  h1 { color:#58a6ff; font-size:20px; margin-bottom:15px; }
  
  select {
    padding:10px; margin:4px; border-radius:8px; border:1px solid #30363d;
    background:#21262d; color:#fff; font-size:14px; width:46%;
  }
  
  #bigBtn {
    display:block; width:100%; max-width:500px; margin:20px auto;
    padding:35px 20px; font-size:28px; font-weight:bold;
    background:linear-gradient(135deg,#238636,#2ea043);
    color:#fff; border:none; border-radius:20px; cursor:pointer;
    box-shadow:0 0 30px rgba(46,160,67,0.5);
  }
  #bigBtn:active { transform:scale(0.97); }
  #bigBtn.loading { background:linear-gradient(135deg,#d29922,#e3b341); }
  
  #result {
    max-width:500px; margin:15px auto; padding:30px 20px;
    border-radius:20px; border:3px solid #30363d;
    background:#161b22; min-height:180px;
    display:flex; flex-direction:column; justify-content:center;
  }
  
  #signalText { font-size:60px; font-weight:900; letter-spacing:4px; }
  .buy #signalText { color:#3fb950; text-shadow:0 0 30px #3fb950; }
  .sell #signalText { color:#f85149; text-shadow:0 0 30px #f85149; }
  .wait #signalText { color:#d29922; text-shadow:0 0 30px #d29922; }
  
  #result.buy { border-color:#3fb950; }
  #result.sell { border-color:#f85149; }
  #result.wait { border-color:#d29922; }
  
  #details { margin-top:15px; font-size:14px; color:#8b949e; line-height:1.7; }
  #details b { color:#c9d1d9; }
  
  #historyBox {
    max-width:500px; margin:15px auto; padding:12px;
    background:#161b22; border-radius:10px; border:1px solid #30363d;
    text-align:left; font-size:13px;
  }
  #historyBox h3 { color:#58a6ff; margin-bottom:8px; font-size:15px; }
  .hist-item { padding:6px 0; border-bottom:1px solid #21262d; color:#8b949e; }
  .hist-buy { color:#3fb950; font-weight:bold; }
  .hist-sell { color:#f85149; font-weight:bold; }
  .hist-wait { color:#d29922; font-weight:bold; }
  
  .note { font-size:11px; color:#8b949e; padding:10px;
          background:#161b22; border-radius:8px; max-width:500px; margin:15px auto; }
</style>
</head>
<body>

<h1>📊 Signal Board Pro</h1>

<select id="pair">
  <option value="EURUSDT">EUR/USD</option>
  <option value="GBPUSDT">GBP/USD</option>
  <option value="BTCUSDT">BTC/USD</option>
  <option value="ETHUSDT">ETH/USD</option>
  <option value="SOLUSDT">SOL/USD</option>
  <option value="AUDUSDT">AUD/USD</option>
</select>

<select id="tf">
  <option value="1m">1 Minute</option>
  <option value="5m" selected>5 Minute</option>
  <option value="15m">15 Minute</option>
  <option value="1h">1 Hour</option>
</select>

<button id="bigBtn" onclick="analyze()">🔍 SIGNAL DE</button>

<div id="result">
  <div id="signalText">--</div>
  <div id="details">Button dabayein</div>
</div>

<div id="historyBox">
  <h3>📋 Signal History</h3>
  <div id="historyList">Abhi koi signal nahi</div>
</div>

<div class="note">
  ⚠️ Yeh tool sirf analysis ke liye hai. Pehle demo par test karein.
</div>

<audio id="beepBuy" preload="auto">

</audio>

<audio id="beepSell" preload="auto">
  <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUarm7blmGgU7k9n1unEiBC13yO/eizEIHWq+8+OWT" type="audio/wav">
</audio>

<script>
let history = [];

async function getData(symbol, tf) {
  const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${tf}&limit=100`;
  const res = await fetch(url);
  const data = await res.json();
  return data.map(c => ({
    open: parseFloat(c[1]),
    high: parseFloat(c[2]),
    low: parseFloat(c[3]),
    close: parseFloat(c[4])
  }));
}

function ema(prices, period) {
  const k = 2 / (period + 1);
  let e = prices.slice(0, period).reduce((a,b)=>a+b,0) / period;
  for (let i = period; i < prices.length; i++) {
    e = prices[i] * k + e * (1 - k);
  }
  return e;
}

function rsi(closes, period = 14) {
  let gains = 0, losses = 0;
  for (let i = closes.length - period; i < closes.length; i++) {
    const diff = closes[i] - closes[i-1];
    if (diff >= 0) gains += diff;
    else losses -= diff;
  }
  const rs = (gains/period) / (losses/period);
  return 100 - (100 / (1 + rs));
}

function macd(closes) {
  return ema(closes, 12) - ema(closes, 26);
}

function stochastic(highs, lows, closes, period = 14) {
  const sliceH = highs.slice(-period);
  const sliceL = lows.slice(-period);
  const high = Math.max(...sliceH);
  const low = Math.min(...sliceL);
  return ((closes[closes.length-1] - low) / (high - low)) * 100;
}

function bollinger(closes, period = 20, mult = 2) {
  const slice = closes.slice(-period);
  const sma = slice.reduce((a,b)=>a+b,0) / period;
  const variance = slice.reduce((a,b)=>a+Math.pow(b-sma,2),0) / period;
  const sd = Math.sqrt(variance);
  const price = closes[closes.length-1];
  return {
    upper: sma + mult*sd,
    lower: sma - mult*sd,
    price: price
  };
}

function candlePattern(candles) {
  const last = candles[candles.length - 1];
  const prev = candles[candles.length - 2];
  const body = Math.abs(last.close - last.open);
  const range = last.high - last.low;
  
  if (last.close > last.open && prev.close < prev.open &&
      last.close > prev.open && last.open < prev.close) return "BUY";
  if (last.close < last.open && prev.close > prev.open &&
      last.close < prev.open && last.open > prev.close) return "SELL";
  if (range > 0 && body / range < 0.3 && last.close > last.open) return "BUY";
  if (range > 0 && body / range < 0.3 && last.close < last.open) return "SELL";
  return "NEUTRAL";
}

function playSound(type) {
  try {
    const audio = document.getElementById(type === 'BUY' ? 'beepBuy' : 'beepSell');
    audio.currentTime = 0;
    audio.play();
    if (navigator.vibrate) {
      navigator.vibrate(type === 'BUY' ? [100,50,100] : [200,100,200]);
    }
  } catch(e) {}
}

function addToHistory(signal, pair, price) {
  const time = new Date().toLocaleTimeString('en-PK', {hour:'2-digit', minute:'2-digit'});
  history.unshift({ signal, pair, price, time });
  if (history.length > 10) history.pop();
  
  const list = document.getElementById('historyList');
  if (history.length === 0) {
    list.innerHTML = 'Abhi koi signal nahi';
    return;
  }
  
  list.innerHTML = history.map(h => {
    const cls = h.signal === 'BUY' ? 'hist-buy' : h.signal === 'SELL' ? 'hist-sell' : 'hist-wait';
    return `<div class="hist-item">${h.time} — ${h.pair} — <span class="${cls}">${h.signal}</span> — ${h.price}</div>`;
  }).join('');
}

async function analyze() {
  const btn = document.getElementById('bigBtn');
  const result = document.getElementById('result');
  const text = document.getElementById('signalText');
  const details = document.getElementById('details');
  
  const pair = document.getElementById('pair').value;
  const tf = document.getElementById('tf').value;
  
  btn.classList.add('loading');
  btn.textContent = '⏳ Analysis...';
  result.className = '';
  text.textContent = '...';
  details.textContent = 'Data la rahe hain...';
  
  try {
    const candles = await getData(pair, tf);
    const closes = candles.map(c => c.close);
    const highs = candles.map(c => c.high);
    const lows = candles.map(c => c.low);
    
    const ema9 = ema(closes, 9);
    const ema21 = ema(closes, 21);
    const rsiVal = rsi(closes);
    const macdVal = macd(closes);
    const stochVal = stochastic(highs, lows, closes);
    const bb = bollinger(closes);
    const candle = candlePattern(candles);
    const price = closes[closes.length - 1];
    
    let buyVotes = 0, sellVotes = 0;
    let log = [];
    
    if (ema9 > ema21) { buyVotes++; log.push('✅ EMA: BUY'); }
    else { sellVotes++; log.push('❌ EMA: SELL'); }
    
    if (rsiVal < 30) { buyVotes++; log.push('✅ RSI: BUY (' + rsiVal.toFixed(1) + ')'); }
    else if (rsiVal > 70) { sellVotes++; log.push('❌ RSI: SELL (' + rsiVal.toFixed(1) + ')'); }
    else log.push('➖ RSI: Neutral (' + rsiVal.toFixed(1) + ')');
    
    if (macdVal > 0) { buyVotes++; log.push('✅ MACD: BUY'); }
    else { sellVotes++; log.push('❌ MACD: SELL'); }
    
    if (stochVal < 20) { buyVotes++; log.push('✅ Stoch: BUY (' + stochVal.toFixed(0) + ')'); }
    else if (stochVal > 80) { sellVotes++; log.push('❌ Stoch: SELL (' + stochVal.toFixed(0) + ')'); }
    else log.push('➖ Stoch: Neutral (' + stochVal.toFixed(0) + ')');
    
    if (price <= bb.lower) { buyVotes++; log.push('✅ BB: BUY'); }
    else if (price >= bb.upper) { sellVotes++; log.push('❌ BB: SELL'); }
    else log.push('➖ BB: Neutral');
    
    if (candle === "BUY") { buyVotes++; log.push('✅ Candle: BUY'); }
    else if (candle === "SELL") { sellVotes++; log.push('❌ Candle: SELL'); }
    else log.push('➖ Candle: Neutral');
    
    let signal = 'WAIT';
    if (buyVotes >= 4 && buyVotes > sellVotes) signal = 'BUY';
    else if (sellVotes >= 4 && sellVotes > buyVotes) signal = 'SELL';
    
    text.textContent = signal;
    result.className = signal.toLowerCase();
    
    if (signal === 'BUY' || signal === 'SELL') {
      playSound(signal);
    }
    
    addToHistory(signal, pair, price.toFixed(4));
    
    details.innerHTML = 
      `<b>${pair}</b> | Price: <b>${price}</b><br>` +
      `Buy: <b style="color:#3fb950">${buyVotes}</b> | ` +
      `Sell: <b style="color:#f85149">${sellVotes}</b><br><br>` +
      log.join('<br>');
    
  } catch (e) {
    text.textContent = 'ERROR';
    details.textContent = 'Data nahi mila. Internet check karein.';
  }
  
  btn.classList.remove('loading');
  btn.textContent = '🔍 SIGNAL DE';
}
</script>

</body>
</html>
